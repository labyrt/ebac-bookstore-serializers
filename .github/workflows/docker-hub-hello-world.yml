name: Publicar Hello World no Docker Hub

on:
  push:
    branches:
      - docker-hub-hello-world
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir imagem para teste
        uses: docker/build-push-action@v7
        with:
          context: ./docker-exercise
          load: true
          push: false
          tags: ebac-hello-world:test

      - name: Testar Hello World
        shell: bash
        run: |
          output="$(docker run --rm ebac-hello-world:test)"
          echo "$output"
          test "$output" = "Hello World - Lucy Mazzini Lessa | EBAC Docker"

      - name: Login no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir e publicar tags
        uses: docker/build-push-action@v7
        with:
          context: ./docker-exercise
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ebac-hello-world:v1.0.0
            ${{ secrets.DOCKERHUB_USERNAME }}/ebac-hello-world:latest

      - name: Confirmar acesso público à imagem
        shell: bash
        run: |
          docker logout
          docker image rm "${{ secrets.DOCKERHUB_USERNAME }}/ebac-hello-world:v1.0.0" 2>/dev/null || true
          docker pull "${{ secrets.DOCKERHUB_USERNAME }}/ebac-hello-world:v1.0.0"
          output="$(docker run --rm "${{ secrets.DOCKERHUB_USERNAME }}/ebac-hello-world:v1.0.0")"
          echo "$output"
          test "$output" = "Hello World - Lucy Mazzini Lessa | EBAC Docker"

      - name: Exibir link da entrega
        shell: bash
        run: |
          echo "Docker Hub: https://hub.docker.com/r/${{ secrets.DOCKERHUB_USERNAME }}/ebac-hello-world"
          echo "Imagem: ${{ secrets.DOCKERHUB_USERNAME }}/ebac-hello-world:v1.0.0"
