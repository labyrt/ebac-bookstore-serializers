name: M23 dependency bootstrap

on:
  push:
    branches:
      - feat-pythonanywhere
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Add GitPython and refresh lock file
        run: |
          if grep -qi 'gitpython' pyproject.toml; then
            echo 'GitPython already present; nothing to update.'
            exit 0
          fi
          poetry add 'GitPython>=3.1,<4.0'

      - name: Commit dependency metadata
        run: |
          if git diff --quiet -- pyproject.toml poetry.lock; then
            echo 'No dependency changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml poetry.lock
          git commit -m 'build: adiciona GitPython para deploy no PythonAnywhere'
          git push
