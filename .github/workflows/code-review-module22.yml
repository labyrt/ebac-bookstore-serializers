name: Code Review & Security - Módulo 22

on:
  push:
    branches:
      - github-actions-ci-module22
  pull_request:
    branches:
      - docker-network-bridge-module21
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  codeql-review:
    name: CodeQL automated review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended

      - name: Analyze Python code
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
