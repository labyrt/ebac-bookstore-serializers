name: Docker Compose + PostgreSQL - Módulo 20

on:
  push:
    branches:
      - docker-compose-postgres-module20
  pull_request:
    branches:
      - dockerize-bookstore-module19
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Criar ambiente efêmero de CI
        shell: bash
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=bookstore_ci
          POSTGRES_USER=bookstore_ci
          POSTGRES_PASSWORD=ci-only-not-a-production-secret
          EOF

      - name: Validar configuração do Compose
        run: docker compose config --quiet

      - name: Construir e subir aplicação + PostgreSQL
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Verificar serviços
        run: docker compose ps

      - name: Confirmar que Django usa PostgreSQL
        run: |
          docker compose exec -T web python manage.py shell -c "from django.db import connection; print('database vendor:', connection.vendor); assert connection.vendor == 'postgresql'"

      - name: Validar configuração Django
        run: docker compose exec -T web python manage.py check

      - name: Executar testes com PostgreSQL
        run: docker compose exec -T web pytest -q

      - name: Validar endpoint da API
        shell: bash
        run: |
          response="$(curl --fail --silent --show-error http://127.0.0.1:8000/api/products/)"
          echo "$response"
          python -c 'import json,sys; data=json.loads(sys.argv[1]); assert data["count"] == 0 and data["results"] == []' "$response"

      - name: Exibir logs em caso de falha
        if: failure()
        run: docker compose logs --no-color

      - name: Encerrar ambiente
        if: always()
        run: docker compose down -v --remove-orphans
