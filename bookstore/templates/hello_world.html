<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bookstore API — EBAC</title>
    <style>
        :root {
            color-scheme: light dark;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: Canvas;
            color: CanvasText;
        }
        main {
            width: min(680px, calc(100% - 48px));
            padding: 40px;
            border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
            border-radius: 20px;
        }
        h1 { margin-top: 0; font-size: clamp(2rem, 6vw, 3.5rem); }
        p { line-height: 1.65; }
        a { color: LinkText; }
        code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    </style>
</head>
<body>
    <main>
        <p>Projeto Final — Full Stack Python / EBAC</p>
        <h1>Hello World!</h1>
        <p>O Bookstore está servindo o projeto Django corretamente. Esta página é usada para validar a publicação e o fluxo de Continuous Delivery do Módulo 23.</p>
        <p>API pública de produtos: <a href="/api/products/"><code>/api/products/</code></a></p>
    </main>
</body>
</html>
